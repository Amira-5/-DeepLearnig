task: classification
model:
  name: simple_cnn
  num_classes: 200
  dropout: 0.3
data:
  batch_size: 32
  image_size: 224
  val_size: 0.2
  seed: 42
  num_workers: 2
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  max_batches: null
output:
  checkpoint: outputs/checkpoints/cls_scratch.pt
  history: outputs/logs/cls_scratch_history.json
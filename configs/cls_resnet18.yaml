task: classification

model:
  name: resnet18
  pretrained: true
  freeze_backbone: false
  num_classes: 200
  dropout: 0.3

data:
  batch_size: 32
  image_size: 224
  val_size: 0.2
  seed: 42
  num_workers: 2

train:
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  max_batches: null

output:
  checkpoint: outputs/checkpoints/cls_resnet18.pt
  history: outputs/logs/cls_resnet18_history.json